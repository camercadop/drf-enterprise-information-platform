[project]
name = "drf-enterprise-information-platform"
version = "0.1.0"
description = "Multi-tenant enterprise platform built with Django REST Framework."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.3.0",
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.1",
    "django-filter>=24.0",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "redis>=8.0.1",
    "django-ipware>=7.0.1",
    "jsonschema>=4.23.0",
    "djangorestframework-simplejwt>=5.5.1",
    "django-cors-headers>=4.9.0",
    "python-json-logger>=3.3.0",
    "rich>=15.0.0",
    "drf-spectacular>=0.30.0",
    "celery[sqlalchemy]>=5.6.3",
    "django-storages>=1.14.6",
    "cryptography>=49.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "factory-boy>=3.3.3",
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-env>=1.7.0",
    "ruff>=0.15.20",
]
otel = [
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-django>=0.57b0",
    "opentelemetry-instrumentation-psycopg2>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-instrumentation-celery>=0.44b0",
    "opentelemetry-exporter-otlp>=1.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "core"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
DJANGO_SETTINGS_MODULE = "config.settings.test"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
env=[
    "DJANGO_SETTINGS_MODULE=config.settings.test",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["*/migrations/*", "*/tests/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    ".venv/",
    ".git/",
    "tests/",
    "migrations/",
]

[tool.coverage.run]
source = ["apps", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
