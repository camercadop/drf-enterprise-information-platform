
services:
  # PostgreSQL Database Service
  # Enterprise-grade relational database for persistent data storage
  postgres:
    image: postgres:16-alpine
    container_name: eip-postgres
    environment:
      POSTGRES_DB: eip_dev
      POSTGRES_USER: eip_user
      POSTGRES_PASSWORD: eip_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - eip_network

  # Redis Cache Service
  # In-memory data structure store for caching and session management
  redis:
    image: redis:7-alpine
    container_name: eip-redis
    command: redis-server --requirepass redis_password
    volumes:
      # Persistent storage for Redis data
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - eip_network

  # Django Application Service
  # Main Python application built using the Dockerfile in the root directory
  app:
    build: .
    container_name: eip-app
    environment:
      DATABASE_URL: postgresql://eip_user:eip_password@postgres:5432/eip_dev
      REDIS_URL: redis://:redis_password@redis:6379/0
      CELERY_BROKER_URL: redis://:redis_password@redis:6379/1
      CELERY_RESULT_BACKEND: db+postgresql://eip_user:eip_password@postgres:5432/eip_dev?options=-csearch_path%3Dasync_tasks
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: django-insecure-dev-key-change-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - eip_network
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./static:/app/static
      - ./media:/app/media

  # Celery Worker Service
  # Background task processing
  celery:
    build: .
    container_name: eip-celery
    command: celery -A config worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://eip_user:eip_password@postgres:5432/eip_dev
      REDIS_URL: redis://:redis_password@redis:6379/0
      CELERY_BROKER_URL: redis://:redis_password@redis:6379/1
      CELERY_RESULT_BACKEND: db+postgresql://eip_user:eip_password@postgres:5432/eip_dev?options=-csearch_path%3Dasync_tasks
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: django-insecure-dev-key-change-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - eip_network
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # OpenTelemetry Collector Service
  # Receives telemetry data from instrumented services and exports to backends
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: eip-otel-collector
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped
    networks:
      - eip_network

  # Tempo Service
  # Distributed tracing backend
  tempo:
    image: grafana/tempo:2.4.1
    container_name: eip-tempo
    command: ["-config.file", "/etc/tempo.yaml"]
    volumes:
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - eip_network

  # Prometheus Service
  # Metrics backend
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: eip-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - eip_network

  # Grafana Service
  # Observability dashboard and visualization
  grafana:
    image: grafana/grafana:11.0.0
    container_name: eip-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped
    networks:
      - eip_network

volumes:
  # Persistent volumes for database data
  postgres_data:
  redis_data:
  tempo_data:
  prometheus_data:
  grafana_data:

# Docker network for service communication
# Isolated network for EIP services with custom subnet
networks:
  eip_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16